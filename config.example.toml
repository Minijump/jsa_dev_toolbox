# Copy this file to config.toml (gitignored) and adapt it to your machine.
# Several projects: 'jsa init' in each one; its .jsa/config.toml holds only what differs from this file.

# Extra folders containing private plugins (*.py with a register(app) function), besides ./plugins/
# plugins_dirs = ["~/projects/my_private_jsa_plugins"]

[codebase]
# Folders containing your custom addons: scanned by 'jsa structure', compared by 'jsa pending-upgrades'
addons_roots = [
    "~/projects/my_company_addons",
    "~/projects/OCA",
]
# Minutes a test, or the setUpClass of a test class, may take in 'jsa structure -c' and 'jsa backfill': beyond, it is
# stopped and fails (a class whose setUpClass fails runs none of its tests). Default 10.
# test_timeout = 10

# The trend charts of the report of 'jsa structure': those shown, and those unfolded at first. The unfolded ones come
# first, in the order of trends_open, then the folded ones in the order of trends. Default: all of them (your
# measures last), coverage and lines of code unfolded. The charts: coverage, loc (lines of code), tests, failed,
# not_installable, no_tests, addons, enterprise, and the labels of your measures (below).
#   [report]
#   trends = ["coverage", "loc", "tests", "TODO comments"]
#   trends_open = ["TODO comments", "coverage"]

# Your own trends in the report of 'jsa structure': a pattern (regular expression) counted in the code of the custom
# addons (the files counted as lines of code: no tests, translations, migrations), recorded by the runs measuring the
# coverage (-c) and drawn with the other trends. files (optional): only the files with these names.
#   [[report.measures]]
#   label = "TODO comments"
#   pattern = '\bTODO\b'              # single quotes: a backslash stays a backslash
#   files = ["*.py", "*.js", "*.xml"]

# The rules of the security review switched off (their keys, given in the report; ["*"] = no review at all).
#   [security]
#   skip = ["csrf_off"]

# Mutation testing of your critical addons ('jsa mutation -p <profile>'): the addons measured when none is given, and
# the methods left out (name globs, "Class.method" or "method").
#   [mutation]
#   addons = ["my_critical_addon"]
#   skip = ["action_view_*", "SaleOrder._compute_display_name"]

# What 'jsa restore' does to the restored database: jsa's standard steps first (jsa/db/restore_steps.toml: 2FA off,
# login 'admin' / password 'admin', expiration date; outgoing mail servers off, itself switched off), then yours, in
# this order (the SQL in one transaction, then the commands).
# - requires: the step is skipped when this table ("table" or "table.column") does not exist (module not installed)
# - odoo_versions = [19]: the step is skipped on the databases of the other versions of Odoo
# - enabled = false: keeps a step here without running it
# A step with the label of a standard one changes it: enabled = false switches it off, enabled = true on.
#   [[restore.extra_steps]]
#   label = "Outgoing mail servers disabled"
#   enabled = true
# Add your own steps (SSO, ...) the same way. A step can also be a jsa command instead of SQL, e.g. one of your
# plugins: it is called with the database name at its end, after the SQL steps. If it fails, the next steps still run
# and the restore tells it.
#   [[restore.extra_steps]]
#   label = "Cover and footer set"
#   command = "set-cover-footer --company 1"   # runs: jsa set-cover-footer --company 1 <database>

# One profile per Odoo installation, selected with --profile/-p (e.g. "jsa structure -c -p 17")
[profiles.17]
python = "~/.virtualenvs/odoo_17/bin/python"  # venv running Odoo (needs 'coverage' 7.6+ installed for -c)
odoo_root = "~/projects/odoo"
enterprise = "~/projects/enterprise"  # optional; its addons are the "enterprise modules" flagged by 'jsa structure'
# Optional, when the defaults do not fit:
# odoo_bin = "~/projects/odoo/odoo-bin"             # default: odoo-bin in odoo_root
# addons_paths = ["~/projects/my_company_addons_17", "~/projects/enterprise", "~/projects/odoo/addons"]
#                                                   # default: your addons_roots, then enterprise, then odoo_root/addons
# db_prefix = "cov17"                               # default: cov (the temporary databases of the coverage runs)
